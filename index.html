<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Study Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

 <h1>Study Planner</h1>

 <div class="Settings"> 
    <label for="sortBy">Sort by:</label>
    <select id="sortBy">
        <option value="dueDate">Due Date</option>
        <option value="subject">Subject</option>
    </select>

    <label for="filterBy">Filter by subject:</label>
    <select id="filterBy">
            <option value="all">All</option>
    </select>
 

 </div>

 <ul id="taskList"></ul>


 <button id="openCreateTask" class="add-task-btn">+</button>

 <div class="modal hidden" id="createTaskModal">
  <div class="modal-card">
    <h2>Create task</h2>

    <input type="text" id="subject" placeholder="Subject">
    <input type="text" id="assignment" placeholder="Assignment">
    <input type="date" id="dueDate">
    <label class="tag-checkbox">
        <input type="checkbox" id="saveAsTag">
             Save subject as tag
    </label>

    <div class="modal-actions">
      <button id="createTask">Create</button>
      <button id="closeCreateTask">Cancel</button>
    </div>
  </div>
</div>

<div class="modal hidden" id="taskModal">
  <div class="task-modal-card">
    <h2 id="taskModalTitle">Task</h2>
    <span id="taskModalAssignment"></span>
    <span id="taskModalDueDate"> </span>


    
  </div>
</div>
  
 
 
 

 <script src="script.js"></script>
</body> 
</html>
